<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Crossfy Bot</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Barlow+Condensed:wght@500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg:       #0d0f12;
      --surface:  #13161b;
      --border:   #1e2530;
      --green:    #00e676;
      --blue:     #40c4ff;
      --red:      #ff5252;
      --muted:    #4a5568;
      --text:     #cdd6e0;
      --font-mono: 'JetBrains Mono', monospace;
      --font-ui:   'Barlow Condensed', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      width: 240px;
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-mono);
      font-size: 12px;
      padding: 16px;
      user-select: none;
    }

    /* ── Header ── */
    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
      margin-bottom: 16px;
    }
    .header-icon {
      width: 32px;
      height: 32px;
      border-radius: 6px;
      background: var(--green);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      flex-shrink: 0;
    }
    .header-title {
      font-family: var(--font-ui);
      font-weight: 700;
      font-size: 16px;
      letter-spacing: .06em;
      color: #fff;
      line-height: 1.1;
    }
    .header-version {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .08em;
    }

    /* ── Status indicator ── */
    .status-row {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 5px;
      margin-bottom: 14px;
    }
    .dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--muted);
      flex-shrink: 0;
    }
    .dot.ready { background: var(--green); animation: pulse 1.8s ease-in-out infinite; }
    @keyframes pulse {
      0%,100% { opacity:1; box-shadow: 0 0 5px var(--green); }
      50%      { opacity:.5; box-shadow: 0 0 14px var(--green); }
    }
    .status-text {
      font-size: 11px;
      color: var(--text);
    }

    /* ── Inject button ── */
    .btn-inject {
      width: 100%;
      padding: 12px 14px;
      border: 1px solid var(--green);
      border-radius: 5px;
      background: transparent;
      color: var(--green);
      font-family: var(--font-ui);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      transition: background .2s, box-shadow .2s;
      margin-bottom: 10px;
    }
    .btn-inject::before {
      content: '';
      position: absolute;
      left: -25%; top: -50%;
      width: 40%; height: 200%;
      background: rgba(255,255,255,.06);
      transform: skewX(-20deg);
      transition: left .45s ease;
    }
    .btn-inject:hover::before { left: 130%; }
    .btn-inject:hover {
      background: rgba(0,230,118,.08);
      box-shadow: 0 0 14px rgba(0,230,118,.3);
    }
    .btn-inject:active {
      background: rgba(0,230,118,.15);
    }
    .btn-inject.injected {
      border-color: var(--muted);
      color: var(--muted);
      cursor: default;
      pointer-events: none;
    }
    .btn-inject.injected::before { display: none; }

    /* ── Info / hint ── */
    .hint {
      font-size: 10px;
      color: var(--muted);
      text-align: center;
      line-height: 1.5;
      padding: 0 4px;
      margin-bottom: 14px;
    }
    .hint span { color: var(--blue); }

    /* ── Divider ── */
    .divider {
      border: none;
      border-top: 1px solid var(--border);
      margin-bottom: 12px;
    }

    /* ── Footer ── */
    .footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .footer-label {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .06em;
      text-transform: uppercase;
    }
    .footer-url {
      font-size: 9px;
      color: var(--muted);
      letter-spacing: .04em;
    }
  </style>
</head>
<body>

  <!-- Header -->
  <div class="header">
    <div class="header-icon">🤖</div>
    <div>
      <div class="header-title">CROSSFY BOT</div>
      <div class="header-version">v5.1 · AUTO-RESERVE</div>
    </div>
  </div>

  <!-- Status -->
  <div class="status-row">
    <div class="dot" id="status-dot"></div>
    <span class="status-text" id="status-text">Listo para inyectar</span>
  </div>

  <!-- Inject button -->
  <button class="btn-inject" id="start-bot">⚡ ACTIVAR BOT</button>

  <!-- Hint -->
  <div class="hint">
    Abrí <span>app.crossfyapp.com</span> antes<br>de activar el bot
  </div>

  <hr class="divider">

  <!-- Footer -->
  <div class="footer">
    <span class="footer-label">Crossfy Bot</span>
    <span class="footer-url">crossfyapp.com</span>
  </div>

  <script src="popup.js"></script>
</body>
</html>
